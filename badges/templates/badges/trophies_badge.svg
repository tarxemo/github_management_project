{% extends 'badges/base.svg' %}
{% load badge_extras %}
{% block content %}
  <defs>
    <!-- Metallic Gradients -->
    {% for trophy in trophies %}
    <linearGradient id="grad_{{ forloop.counter }}" x1="0%" y1="0%" x2="45%" y2="100%">
      <stop offset="0%" style="stop-color:{{ trophy.grad_1 }};stop-opacity:1" />
      <stop offset="70%" style="stop-color:{{ trophy.grad_1 }};stop-opacity:1" />
      <stop offset="100%" style="stop-color:{{ trophy.grad_2 }};stop-opacity:1" />
    </linearGradient>
    {% endfor %}

    <!-- Specific Style Override for Trophies to prevent overlap -->
    <style type="text/css"><![CDATA[
      .trophy-title { font: 700 9px 'SF Mono', 'Menlo', monospace; letter-spacing: 1px; text-transform: uppercase; }
      .trophy-value { font: 800 10px 'SF Pro Display', 'Inter', system-ui; opacity: 0.9; }
      .trophy-rank-label { font: 600 8px 'SF Mono', 'Menlo', monospace; opacity: 0.6; }
    ]]></style>
  </defs>

  <g transform="translate(28,24)">
    <text font-family="'SF Mono', 'Menlo', monospace" font-weight="700" font-size="14" fill="{{ text_override|default:'#fff' }}">{{ display_name }} · GitHub Trophies</text>
  </g>

  <g transform="translate(28,64)">
    {% for trophy in trophies %}
      <!-- Positioned in grid based on row/col calculated in service -->
      <g transform="translate({{ trophy.col|multiply:136 }}, {{ trophy.row|multiply:130 }})">
        <!-- Trophy Card Background -->
        <rect x="0" y="0" width="120" height="110" rx="12" fill="var(--panel)" stroke="var(--panel-border)" opacity="0.6" />
        
        <!-- Laurel Leaves (for high ranks) -->
        {% if trophy.show_leaves %}
        <g transform="translate(15, 12) scale(0.005)" fill="{{ trophy.color }}" opacity="0.2">
          <path d="M200 5103 c0 -2 18 -40 41 -84 47 -95 62 -132 50 -125 -15 10 -18 -39 -6 -87 31 -121 265 -468 412 -608 124 -119 281 -222 383 -251 36 -10 49 -16 30 -13 -19 3 -78 12 -130 20 -117 17 -353 35 -477 35 l-93 0 53 -82 c72 -112 72 -112 59 -104 -18 11 -26 -41 -13 -84 25 -84 261 -376 404 -502 95 -83 222 -168 304 -205 98 -43 194 -73 242 -74 l46 -1 -45 -8 c-25 -5 -124 -21 -220 -36 -96 -15 -177 -29 -180 -31 -2 -2 0 -7 5 -11 27 -19 138 -144 123 -139 -18 6 -28 -10 -28 -47 0 -38 53 -108 141 -187 349 -313 631 -450 939 -453 63 0 131 2 150 7 19 4 -35 -17 -120 -46 -236 -82 -310 -110 -310 -117 0 -3 29 -28 65 -54 55 -40 102 -84 67 -62 -13 8 -32 -24 -32 -54 0 -99 486 -361 790 -426 125 -27 327 -25 444 4 113 28 261 98 309 145 39 40 56 92 38 124 -8 17 -4 24 29 49 22 16 40 32 40 36 0 4 -26 40 -58 80 -162 203 -368 328 -608 369 -89 15 -368 6 -474 -15 -131 -26 -147 -26 -59 -3 51 13 102 34 122 50 38 29 61 84 51 123 -5 18 1 26 25 39 17 8 31 19 31 23 0 4 -16 38 -35 75 -163 317 -424 501 -781 548 -113 15 -127 19 -91 30 51 14 84 58 89 118 1 20 9 33 20 37 23 7 23 6 -12 114 -108 329 -305 534 -640 662 -41 15 -59 25 -40 21 19 -5 82 -8 140 -8 81 0 113 4 142 18 39 20 73 76 65 107 -3 12 2 20 14 23 23 6 23 21 4 124 -61 320 -249 568 -544 718 -157 79 -394 147 -666 190 -88 13 -170 26 -182 29 -13 2 -23 2 -23 -1z" />
          <path d="M12550 5099 c-232 -36 -334 -55 -445 -84 -484 -122 -761 -346 -880 -712 -26 -79 -57 -242 -48 -255 2 -5 14 -8 26 -9 12 0 16 -3 10 -6 -17 -6 -16 -38 2 -72 25 -49 75 -66 200 -66 61 0 124 4 140 8 17 5 -13 -9 -66 -31 -136 -55 -250 -126 -341 -211 -128 -120 -217 -263 -272 -439 -32 -101 -32 -110 -3 -122 12 -5 17 -9 11 -9 -8 -1 -9 -12 -5 -34 15 -66 41 -95 94 -107 31 -7 31 -7 7 -12 -14 -3 -72 -13 -130 -22 -322 -51 -553 -206 -714 -479 -25 -42 -52 -92 -60 -111 -14 -33 -14 -33 23 -54 20 -12 31 -22 26 -22 -15 0 -17 -39 -4 -78 14 -42 76 -88 130 -97 22 -4 39 -9 36 -11 -2 -2 -55 3 -118 12 -154 22 -395 15 -494 -13 -216 -62 -391 -184 -545 -380 l-41 -52 40 -32 c34 -27 39 -35 30 -51 -17 -33 -1 -85 38 -125 48 -47 196 -117 309 -145 117 -29 319 -31 444 -4 300 64 790 328 790 425 0 29 -18 63 -31 56 -5 -4 -9 -4 -9 -2 0 3 34 29 75 59 41 29 75 56 75 59 0 3 -21 13 -47 22 -349 120 -422 146 -388 140 59 -12 241 -8 310 6 208 43 437 158 636 322 241 199 314 293 265 342 -13 12 -6 24 51 86 36 40 64 73 62 75 -4 2 -107 20 -359 60 -70 12 -77 14 -39 15 48 1 144 31 241 74 139 62 318 202 451 352 104 117 225 279 249 333 21 47 21 99 0 94 -16 -3 -10 9 58 116 l50 77 -72 3 c-91 4 -362 -14 -488 -33 -179 -26 -179 -26 -116 -9 93 26 244 120 365 230 193 174 467 605 443 696 -2 10 -8 15 -13 12 -12 -7 3 30 51 126 23 45 40 85 38 89 -2 4 -23 4 -48 0z" />
        </g>
        {% endif %}

        <!-- Optimized Trophy Cup (1.5x larger scale) -->
        <g transform="translate(33, 22) scale(1.5)">
          <path d="M4 32 h28 a2 2 0 0 1 2 2 v2 a2 2 0 0 1 -2 2 h-28 a2 2 0 0 1 -2 -2 v-2 a2 2 0 0 1 2 -2 z" fill="url(#grad_{{ forloop.counter }})" />
          <path d="M12 28 h12 v4 h-12 z" fill="url(#grad_{{ forloop.counter }})" opacity="0.8" />
          <path d="M6 0 h24 c0 10 -4 28 -12 28 c-8 0 -12 -18 -12 -28 z" fill="url(#grad_{{ forloop.counter }})" />
          <path d="M6 4 q-8 0 -8 8 t8 8 m24 0 q8 0 8 -8 t-8 -8" fill="none" stroke="url(#grad_{{ forloop.counter }})" stroke-width="2.5" stroke-linecap="round" />
          
          <!-- Rank Letter Circle (Centered in Cup) -->
          <circle cx="18" cy="14" r="7" fill="var(--panel)" />
          <text x="18" y="18" font-family="'Courier Prime', 'Courier New', monospace" font-weight="900" font-size="11" fill="{{ trophy.color }}" text-anchor="middle">{{ trophy.rank|first }}</text>
        </g>

        <!-- Small indications for labels/values -->
        <text x="60" y="15" font-family="'SF Mono', 'Menlo', monospace" font-weight="700" font-size="8" fill="{{ trophy.color }}" text-anchor="middle" letter-spacing="0.5">{{ trophy.title|upper }}</text>
        <text x="60" y="92" font-family="'SF Mono', 'Menlo', monospace" font-weight="600" font-size="8" fill="var(--muted)" text-anchor="middle" opacity="0.6">{{ trophy.label|upper }}</text>
        <text x="60" y="103" font-family="'Inter', system-ui" font-weight="800" font-size="9" fill="var(--text)" text-anchor="middle">{{ trophy.value }}</text>
      </g>
    {% endfor %}
  </g>
{% endblock %}
